pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js}"
      run: npx oxlint --fix {staged_files}
    format:
      glob: "*.{ts,tsx,js,json}"
      run: npx oxfmt --write {staged_files}

pre-push:
  jobs:
    - name: coverage
      run: npx vitest run --coverage --coverage.thresholds.lines=80
    - name: typecheck
      run: npx tsc --noEmit
