# nginx configuration for DinoSteps static SPA
# Loaded as /etc/nginx/conf.d/default.conf by the nginx:alpine image.
#
# Features:
#   - SPA history fallback: deep links resolve to /index.html
#   - Gzip compression for text-like assets
#   - Long-term (1 year, immutable) cache for Vite content-hashed /assets/*
#   - No-cache for index.html so users always get the latest entry point
#   - Security headers on every response
#
# Note on Brotli: the stock `nginx:alpine` image does NOT include the
# brotli module. Adding `brotli on;` here would cause nginx to fail at
# startup with "unknown directive". Gzip alone is used for compression.
# See tech-stack.md for the documented deviation.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (apply to all responses) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Compression: gzip ----
    # `text/html` is compressed by default and must not be re-listed in
    # `gzip_types` (nginx logs a duplicate-MIME warning otherwise).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Cache hashed Vite assets for 1 year (immutable) ----
    # Vite's /assets/* output is content-hashed; safe to cache forever.
    # add_header in the server block is NOT inherited into this location
    # block (nginx rule), so security headers are re-emitted here.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---- index.html: always revalidate with the server ----
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- SPA history fallback ----
    # All other paths: try the file, then the dir, then /index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
