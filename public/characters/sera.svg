<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Sera - Cute Chibi Stegosaurus (red) -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
  </defs>

  <!-- Tail (big, with spikes) -->
  <path d="M72,72 Q88,68 98,60 Q104,54 102,48 Q100,44 94,46 Q88,50 80,58 Q76,64 72,68 Z" fill="#ef5350"/>
  <!-- Tail spikes (thagomizer) -->
  <path d="M96,50 L104,42 L98,52" fill="#f5f5dc"/>
  <path d="M90,56 L96,48 L92,58" fill="#f5f5dc"/>
  <path d="M84,62 L90,54 L86,64" fill="#f5f5dc"/>

  <!-- Back legs -->
  <path d="M46,78 L44,96 Q44,100 48,100 L54,100 Q58,100 58,96 L56,78" fill="#e53935"/>
  <ellipse cx="51" cy="100" rx="8" ry="3" fill="#c62828"/>

  <!-- Front legs -->
  <path d="M64,76 L62,94 Q62,98 66,98 L72,98 Q76,98 76,94 L74,76" fill="#e53935"/>
  <ellipse cx="69" cy="98" rx="8" ry="3" fill="#c62828"/>

  <!-- Body (large, arched back) -->
  <ellipse cx="56" cy="66" rx="24" ry="18" fill="url(#bodyGrad)"/>

  <!-- Belly -->
  <ellipse cx="58" cy="72" rx="16" ry="10" fill="rgba(255,255,255,0.12)"/>

  <!-- Back plates (Stegosaurus-style, along the top) -->
  <path d="M34,50 L38,28 L42,50" fill="#d32f2f"/>
  <path d="M42,46 L46,22 L50,46" fill="#d32f2f"/>
  <path d="M50,44 L54,18 L58,44" fill="#d32f2f"/>
  <path d="M58,46 L62,24 L66,46" fill="#d32f2f"/>
  <path d="M64,50 L68,32 L70,50" fill="#d32f2f"/>

  <!-- Neck -->
  <path d="M70,52 Q72,44 74,38 L82,38 Q80,44 78,52 Z" fill="#ef5350"/>

  <!-- Head (BIG, round) -->
  <ellipse cx="82" cy="28" rx="18" ry="16" fill="url(#headGrad)"/>

  <!-- Snout -->
  <ellipse cx="98" cy="32" rx="8" ry="6" fill="#ef5350"/>

  <!-- Eye socket -->
  <circle cx="84" cy="22" r="8" fill="white"/>
  <!-- Pupil -->
  <circle cx="87" cy="22" r="4" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="89" cy="19" r="1.5" fill="white"/>

  <!-- Nostril -->
  <circle cx="104" cy="30" r="1.2" fill="#c62828"/>

  <!-- Smile -->
  <path d="M90,34 Q96,38 102,34" fill="none" stroke="#c62828" stroke-width="1" stroke-linecap="round"/>

  <!-- Body spots -->
  <circle cx="44" cy="62" r="2.5" fill="rgba(198,40,40,0.15)"/>
  <circle cx="56" cy="58" r="2" fill="rgba(198,40,40,0.15)"/>
  <circle cx="66" cy="62" r="1.8" fill="rgba(198,40,40,0.15)"/>
</svg>
