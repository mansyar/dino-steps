<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Sera - Friendly Stegosaurus (red) -->
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
  </defs>

  <!-- Tail (big, with spikes) -->
  <path d="M18,40 Q8,36 4,34 Q1,33 2,36 Q3,40 6,44 Q10,48 18,46 Z" fill="#ef5350"/>
  <!-- Tail spikes (thagomizer) -->
  <path d="M6,34 L2,28 L8,34" fill="#f5f5dc"/>
  <path d="M4,36 L0,32 L6,37" fill="#f5f5dc"/>
  <path d="M8,42 L4,46 L10,43" fill="#f5f5dc"/>

  <!-- Back leg -->
  <path d="M34,50 L34,62 Q34,66 38,66 L44,66 Q48,66 48,62 L48,50" fill="#e53935"/>
  <ellipse cx="41" cy="66" rx="7" ry="3" fill="#c62828"/>

  <!-- Front leg -->
  <path d="M60,48 L60,60 Q60,64 64,64 L70,64 Q74,64 74,60 L74,48" fill="#e53935"/>
  <ellipse cx="67" cy="64" rx="7" ry="3" fill="#c62828"/>

  <!-- Body (large, arched) -->
  <ellipse cx="46" cy="38" rx="28" ry="18" fill="url(#bodyGrad)"/>

  <!-- Belly highlight -->
  <ellipse cx="48" cy="42" rx="20" ry="9" fill="rgba(255,255,255,0.12)"/>

  <!-- Back plates (Stegosaurus-style) -->
  <path d="M24,24 L28,8 L32,24" fill="#d32f2f"/>
  <path d="M34,22 L38,4 L42,22" fill="#d32f2f"/>
  <path d="M44,20 L48,2 L52,20" fill="#d32f2f"/>
  <path d="M54,22 L58,8 L62,22" fill="#d32f2f"/>
  <path d="M62,26 L66,14 L68,26" fill="#d32f2f"/>

  <!-- Neck -->
  <path d="M70,30 Q74,22 76,18 L82,20 Q80,24 76,34 Z" fill="#ef5350"/>

  <!-- Head (small) -->
  <ellipse cx="86" cy="18" rx="10" ry="8" fill="#ef5350"/>

  <!-- Snout -->
  <ellipse cx="96" cy="20" rx="5" ry="4" fill="#ef5350"/>

  <!-- Eye white -->
  <circle cx="86" cy="14" r="4" fill="white"/>
  <!-- Pupil -->
  <circle cx="87.5" cy="14" r="2" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="88.5" cy="12.5" r="0.8" fill="white"/>

  <!-- Nostril -->
  <circle cx="100" cy="18" r="1" fill="#c62828"/>

  <!-- Smile -->
  <path d="M90,20 Q93,22 96,20" fill="none" stroke="#c62828" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Body pattern -->
  <circle cx="36" cy="34" r="2.5" fill="rgba(198,40,40,0.2)"/>
  <circle cx="48" cy="30" r="2" fill="rgba(198,40,40,0.2)"/>
  <circle cx="58" cy="34" r="1.8" fill="rgba(198,40,40,0.2)"/>
</svg>
