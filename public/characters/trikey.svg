<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Trikey - Friendly Triceratops (blue) -->
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </radialGradient>
  </defs>

  <!-- Tail (short) -->
  <path d="M22,42 Q12,40 8,42 Q6,44 8,46 Q12,48 22,46 Z" fill="#42a5f5"/>

  <!-- Back leg -->
  <path d="M32,50 L32,62 Q32,66 36,66 L42,66 Q46,66 46,62 L46,50" fill="#1e88e5"/>
  <ellipse cx="39" cy="66" rx="7" ry="3" fill="#1565c0"/>

  <!-- Front leg -->
  <path d="M56,48 L56,60 Q56,64 60,64 L66,64 Q70,64 70,60 L70,48" fill="#1e88e5"/>
  <ellipse cx="63" cy="64" rx="7" ry="3" fill="#1565c0"/>

  <!-- Body (stocky) -->
  <ellipse cx="44" cy="40" rx="26" ry="18" fill="url(#bodyGrad)"/>

  <!-- Belly highlight -->
  <ellipse cx="46" cy="44" rx="18" ry="9" fill="rgba(255,255,255,0.12)"/>

  <!-- Frill behind head -->
  <path d="M68,10 Q60,2 52,6 Q48,10 50,18 Q52,24 58,28 Q64,30 68,26 Q72,22 72,16 Z" fill="#1e88e5"/>
  <!-- Frill edge pattern -->
  <path d="M56,8 Q54,6 52,8" fill="none" stroke="#1565c0" stroke-width="1"/>
  <path d="M60,5 Q58,3 56,5" fill="none" stroke="#1565c0" stroke-width="1"/>
  <path d="M64,6 Q62,4 60,6" fill="none" stroke="#1565c0" stroke-width="1"/>

  <!-- Head -->
  <ellipse cx="78" cy="20" rx="16" ry="13" fill="#42a5f5"/>

  <!-- Snout -->
  <ellipse cx="94" cy="24" rx="8" ry="7" fill="#42a5f5"/>

  <!-- Brow horns -->
  <path d="M72,10 L68,-2 L74,8 Z" fill="#f5f5dc"/>
  <path d="M80,8 L80,-4 L84,8 Z" fill="#f5f5dc"/>

  <!-- Nose horn -->
  <path d="M96,18 L102,12 L98,20 Z" fill="#f5f5dc"/>

  <!-- Eye white -->
  <circle cx="80" cy="16" r="5" fill="white"/>
  <!-- Pupil -->
  <circle cx="82" cy="16" r="2.5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="83" cy="14.5" r="1" fill="white"/>

  <!-- Nostril -->
  <circle cx="100" cy="22" r="1.2" fill="#1565c0"/>

  <!-- Smile -->
  <path d="M86,24 Q90,27 94,24" fill="none" stroke="#1565c0" stroke-width="1" stroke-linecap="round"/>

  <!-- Body pattern (lighter patches) -->
  <circle cx="34" cy="36" r="3" fill="rgba(255,255,255,0.1)"/>
  <circle cx="44" cy="32" r="2.5" fill="rgba(255,255,255,0.1)"/>
  <circle cx="52" cy="38" r="2" fill="rgba(255,255,255,0.1)"/>
</svg>
