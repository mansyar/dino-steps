<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Trikey - Cute Chibi Triceratops (blue) -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
  </defs>

  <!-- Tail (short) -->
  <path d="M74,72 Q88,70 94,72 Q98,74 96,78 Q92,80 84,80 Q78,78 74,76 Z" fill="#42a5f5"/>

  <!-- Back legs -->
  <path d="M46,78 L44,96 Q44,100 48,100 L54,100 Q58,100 58,96 L56,78" fill="#1e88e5"/>
  <ellipse cx="51" cy="100" rx="8" ry="3" fill="#1565c0"/>

  <!-- Front legs -->
  <path d="M64,76 L62,94 Q62,98 66,98 L72,98 Q76,98 76,94 L74,76" fill="#1e88e5"/>
  <ellipse cx="69" cy="98" rx="8" ry="3" fill="#1565c0"/>

  <!-- Body (stocky, round) -->
  <ellipse cx="58" cy="68" rx="22" ry="16" fill="url(#bodyGrad)"/>

  <!-- Belly -->
  <ellipse cx="60" cy="72" rx="14" ry="9" fill="rgba(255,255,255,0.12)"/>

  <!-- Frill behind head (big, fan-shaped) -->
  <path d="M44,18 Q30,8 22,14 Q18,20 22,30 Q26,38 34,42 Q42,44 48,38 Q52,32 50,24 Z" fill="#1e88e5"/>
  <!-- Frill decorative edge -->
  <path d="M26,16 Q24,12 22,14" fill="none" stroke="#1565c0" stroke-width="1.2"/>
  <path d="M30,12 Q28,8 26,10" fill="none" stroke="#1565c0" stroke-width="1.2"/>
  <path d="M36,10 Q34,6 32,8" fill="none" stroke="#1565c0" stroke-width="1.2"/>
  <path d="M42,12 Q40,8 38,10" fill="none" stroke="#1565c0" stroke-width="1.2"/>

  <!-- Neck -->
  <path d="M52,52 Q50,44 52,38 L62,36 Q64,42 62,52 Z" fill="#42a5f5"/>

  <!-- Head (BIG) -->
  <ellipse cx="56" cy="28" rx="24" ry="20" fill="url(#headGrad)"/>

  <!-- Snout -->
  <ellipse cx="78" cy="32" rx="10" ry="8" fill="#42a5f5"/>

  <!-- Brow horns -->
  <path d="M46,12 L40,-4 L50,10 Z" fill="#f5f5dc"/>
  <path d="M58,10 L56,-6 L62,10 Z" fill="#f5f5dc"/>

  <!-- Nose horn -->
  <path d="M82,24 L90,16 L84,26 Z" fill="#f5f5dc"/>

  <!-- Eye socket -->
  <circle cx="58" cy="22" r="9" fill="white"/>
  <!-- Pupil -->
  <circle cx="61" cy="22" r="4.5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="63" cy="19" r="1.8" fill="white"/>

  <!-- Nostril -->
  <circle cx="86" cy="30" r="1.5" fill="#1565c0"/>

  <!-- Smile -->
  <path d="M66,34 Q74,40 82,34" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Body spots -->
  <circle cx="48" cy="64" r="2.5" fill="rgba(25,118,210,0.15)"/>
  <circle cx="58" cy="60" r="2" fill="rgba(25,118,210,0.15)"/>
  <circle cx="66" cy="64" r="1.8" fill="rgba(25,118,210,0.15)"/>
</svg>
