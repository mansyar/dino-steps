  <line x1="42" y1="58" x2="20" y2="52" stroke="#c62828" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="42" y1="58" x2="26" y2="60" stroke="#c62828" stroke-width="0.6" stroke-linecap="round"/>
</svg>
