<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Rexy - Cute Chibi T-Rex (green) -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
  </defs>

  <!-- Tail (curves up and to the right) -->
  <path d="M72,72 Q90,68 100,58 Q108,50 106,44 Q104,40 98,42 Q92,46 84,56 Q78,64 72,68 Z" fill="#4caf50"/>
  <path d="M92,54 Q100,48 104,44" fill="none" stroke="#388e3c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Back leg (left) -->
  <path d="M44,78 L42,96 Q42,100 46,100 L52,100 Q56,100 56,96 L54,78" fill="#388e3c"/>
  <ellipse cx="49" cy="100" rx="8" ry="3" fill="#2e7d32"/>

  <!-- Front leg (right) -->
  <path d="M62,76 L60,94 Q60,98 64,98 L70,98 Q74,98 74,94 L72,76" fill="#388e3c"/>
  <ellipse cx="67" cy="98" rx="8" ry="3" fill="#2e7d32"/>

  <!-- Body (small, round) -->
  <ellipse cx="56" cy="68" rx="20" ry="14" fill="url(#bodyGrad)"/>

  <!-- Belly -->
  <ellipse cx="58" cy="72" rx="12" ry="8" fill="rgba(255,255,255,0.15)"/>

  <!-- Left arm (tiny) -->
  <path d="M42,64 Q38,68 36,72 L38,74 Q40,70 44,66 Z" fill="#4caf50"/>
  <!-- Left hand fingers -->
  <circle cx="36" cy="73" r="1.5" fill="#4caf50"/>

  <!-- Right arm (tiny) -->
  <path d="M64,62 Q68,66 70,70 L72,68 Q70,64 66,60 Z" fill="#4caf50"/>
  <!-- Right hand fingers -->
  <circle cx="71" cy="69" r="1.5" fill="#4caf50"/>

  <!-- Neck -->
  <path d="M50,56 Q48,48 50,42 L60,40 Q62,46 60,56 Z" fill="#4caf50"/>

  <!-- Head (BIG - dominant feature) -->
  <ellipse cx="54" cy="30" rx="26" ry="22" fill="url(#headGrad)"/>

  <!-- Snout -->
  <ellipse cx="76" cy="34" rx="12" ry="9" fill="#4caf50"/>

  <!-- Top of head -->
  <ellipse cx="48" cy="12" rx="14" ry="8" fill="#66bb6a"/>

  <!-- Eye socket (white) -->
  <circle cx="60" cy="22" r="10" fill="white"/>
  <!-- Pupil -->
  <circle cx="63" cy="22" r="5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="65" cy="19" r="2" fill="white"/>

  <!-- Brow ridge -->
  <path d="M48,14 Q54,12 62,14" fill="none" stroke="#388e3c" stroke-width="2" stroke-linecap="round"/>

  <!-- Nostrils -->
  <circle cx="84" cy="32" r="1.5" fill="#388e3c"/>
  <circle cx="80" cy="30" r="1.2" fill="#388e3c"/>

  <!-- Mouth/smile -->
  <path d="M68,38 Q76,44 84,38" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Teeth (cute, small) -->
  <rect x="72" y="38" width="3" height="3" rx="1" fill="white"/>
  <rect x="77" y="39" width="3" height="2.5" rx="1" fill="white"/>

  <!-- Body spots -->
  <circle cx="46" cy="64" r="2.5" fill="rgba(56,142,60,0.25)"/>
  <circle cx="56" cy="60" r="2" fill="rgba(56,142,60,0.25)"/>
  <circle cx="64" cy="64" r="1.8" fill="rgba(56,142,60,0.25)"/>
</svg>
