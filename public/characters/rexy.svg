<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Rexy - Friendly T-Rex (green) -->
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </radialGradient>
  </defs>

  <!-- Tail -->
  <path d="M25,38 Q10,34 5,30 Q2,28 4,32 Q6,36 8,40 Q12,44 25,42 Z" fill="#4caf50"/>
  <path d="M12,33 Q6,30 4,32" fill="none" stroke="#388e3c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Back leg -->
  <path d="M38,48 L38,62 Q38,66 42,66 L46,66 Q50,66 50,62 L50,48" fill="#388e3c"/>
  <ellipse cx="44" cy="66" rx="6" ry="3" fill="#2e7d32"/>

  <!-- Front leg -->
  <path d="M58,46 L58,60 Q58,64 62,64 L66,64 Q70,64 70,60 L70,46" fill="#388e3c"/>
  <ellipse cx="64" cy="64" rx="6" ry="3" fill="#2e7d32"/>

  <!-- Body -->
  <ellipse cx="48" cy="38" rx="24" ry="16" fill="url(#bodyGrad)"/>

  <!-- Belly highlight -->
  <ellipse cx="50" cy="42" rx="16" ry="8" fill="rgba(255,255,255,0.15)"/>

  <!-- Neck -->
  <path d="M66,30 Q70,20 74,16 L80,18 Q76,22 72,32 Z" fill="#4caf50"/>

  <!-- Head -->
  <ellipse cx="82" cy="14" rx="14" ry="10" fill="#4caf50"/>

  <!-- Snout -->
  <ellipse cx="96" cy="16" rx="8" ry="6" fill="#4caf50"/>

  <!-- Top of head bump -->
  <ellipse cx="80" cy="6" rx="8" ry="4" fill="#4caf50"/>

  <!-- Jaw (lower) -->
  <path d="M88,20 Q92,22 98,20 Q96,18 92,18 Q88,18 88,20 Z" fill="#388e3c"/>

  <!-- Eye white -->
  <circle cx="84" cy="10" r="5" fill="white"/>
  <!-- Pupil -->
  <circle cx="86" cy="10" r="2.5" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="87" cy="8.5" r="1" fill="white"/>

  <!-- Nostril -->
  <circle cx="102" cy="14" r="1.2" fill="#388e3c"/>

  <!-- Smile -->
  <path d="M90,18 Q94,21 98,18" fill="none" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>

  <!-- Tiny arm -->
  <path d="M62,36 Q64,40 62,44 L60,42 Q61,38 60,36 Z" fill="#4caf50"/>

  <!-- Spots on body -->
  <circle cx="38" cy="34" r="2" fill="rgba(56,142,60,0.3)"/>
  <circle cx="46" cy="30" r="1.5" fill="rgba(56,142,60,0.3)"/>
  <circle cx="54" cy="32" r="1.8" fill="rgba(56,142,60,0.3)"/>
</svg>
